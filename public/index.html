<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a2e">
  <meta name="description" content="現在地の近くの喫煙所を地図と一覧で探せます。">
  <title>けむりマップ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <h1>けむりマップ</h1>
      <span id="net" class="net" hidden>オフライン</span>
    </div>
    <div class="filters" role="group" aria-label="表示する種類">
      <label class="chip"><input type="checkbox" id="f-area" checked><span>喫煙所</span></label>
      <label class="chip"><input type="checkbox" id="f-shop"><span>喫煙可の店</span></label>
      <label class="chip"><input type="checkbox" id="f-heated" checked><span>加熱式専用も表示</span></label>
    </div>
  </header>

  <main id="map" aria-label="地図"></main>
  <div id="crosshair" class="crosshair" hidden aria-hidden="true"></div>

  <div class="fabs">
    <button id="btn-locate" class="fab" type="button" aria-label="現在地へ移動">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button id="btn-add" class="fab fab-accent" type="button" aria-label="喫煙所を投稿">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <section id="sheet" class="sheet" aria-label="近くの喫煙所">
    <button id="sheet-handle" class="handle" type="button" aria-expanded="true" aria-controls="sheet-body">
      <span class="grip" aria-hidden="true"></span>
      <span id="summary" class="summary">読み込み中…</span>
    </button>
    <div id="sheet-body" class="sheet-body">
      <p id="hint" class="hint" hidden></p>
      <ol id="list" class="list"></ol>

      <form id="add-form" class="add-form" hidden novalidate>
        <h2>喫煙所を投稿</h2>
        <p class="help">地図を動かして、中央の印を喫煙所の位置に合わせてください。</p>
        <label class="field">名前（任意）
          <input id="add-name" name="name" maxlength="60" placeholder="例：駅東口 喫煙ブース" autocomplete="off">
        </label>
        <fieldset class="field">
          <legend>種類</legend>
          <label class="radio"><input type="radio" name="kind" value="outdoor" checked> 屋外の喫煙所</label>
          <label class="radio"><input type="radio" name="kind" value="indoor"> 屋内の喫煙室</label>
          <label class="radio"><input type="radio" name="kind" value="shop"> 喫煙できる店</label>
        </fieldset>
        <label class="check"><input type="checkbox" id="add-heated" name="heated_only"> 加熱式たばこ専用</label>
        <label class="field">メモ（任意）
          <textarea id="add-note" name="note" maxlength="200" rows="2" placeholder="例：改札を出て右、屋根あり"></textarea>
        </label>
        <p id="add-error" class="error" role="alert" hidden></p>
        <div class="row">
          <button type="button" id="add-cancel" class="btn">やめる</button>
          <button type="submit" class="btn btn-accent">この位置で投稿</button>
        </div>
      </form>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
