# push・PR ごとに、ローカルの Pages 実行環境で画面の動作確認（tests/e2e.mjs）を行う。
# main では、テストが通ったあと Cloudflare Pages に公開する（scripts/deploy.mjs）。
# 週1回のデータ更新（data）は GitHub の仕様でこのワークフローを起動しないので、data の完了を受けて動かす。
name: ci
on:
  push:
    paths-ignore: ['**.md']
  pull_request:
  workflow_run:
    workflows: [data]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # main は公開の途中で止めない
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  e2e:
    # データ更新が失敗したときは、公開し直さない
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run vendor
      - run: npm run db:init
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: ローカルの Pages を起動
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && exit 0; sleep 1; done
          cat dev.log; exit 1
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: STATIC=0 npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
      # 全国データと公開情報の届く順を入れ替えても通ること
      - run: SLOW_JP=1500 npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: SLOW_PLACES=1500 npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
      # PR では公開しない（フォークからの PR には Secrets も渡らない）
      - name: Cloudflare Pages に公開（main のみ）
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
